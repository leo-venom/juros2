<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Taxas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at 20% 20%, #0f1a14 0%, #050807 60%, #000000 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(20, 30, 25, 0.55);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(0, 255, 140, 0.25);
            padding: 22px;
            border-radius: 18px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 255, 140, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .card-topo {
            position: sticky;
            top: 15px;
            z-index: 1000;
        }

        h2 {
            text-align: center;
            color: #e8fff2;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(0, 255, 140, 0.35);
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #9fe8c4;
            font-size: 13px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(0, 255, 140, 0.3);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.35);
            color: #f0fff8;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(240, 255, 248, 0.35);
        }

        input[type="text"]:focus, select:focus {
            border-color: #00ff8c;
            box-shadow: 0 0 0 3px rgba(0, 255, 140, 0.15);
        }

        select option {
            background: #0f1a14;
            color: #f0fff8;
        }

        /* Caixa de resultado selecionado e soma */
        .info-box {
            background: rgba(0, 255, 140, 0.05);
            border: 1px solid rgba(0, 255, 140, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .resultado-atual {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #d7f5e6;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 140, 0.15);
        }

        .resultado-atual .valor-destaque {
            font-size: 17px;
            font-weight: bold;
            color: #00ff8c;
            text-shadow: 0 0 8px rgba(0, 255, 140, 0.35);
        }

        .soma-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 140, 0.07);
            border: 1px dashed rgba(0, 255, 140, 0.35);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: #cdf7e2;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .soma-box:hover {
            background: rgba(0, 255, 140, 0.12);
        }

        .soma-box .soma-valor {
            font-weight: bold;
            font-size: 16px;
            color: #00ff8c;
            text-shadow: 0 0 8px rgba(0, 255, 140, 0.35);
        }

        .soma-box .soma-limpar {
            font-size: 11px;
            color: rgba(205, 247, 226, 0.6);
            text-decoration: underline;
        }

        .btn-adicionar {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00ff8c 0%, #00b362 100%);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #050807;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 140, 0.3);
        }

        .btn-adicionar:hover {
            opacity: 0.9;
        }

        .btn-adicionar:active {
            transform: scale(0.98);
        }

        /* Teclado Numérico integrado no mesmo box */
        .teclado-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            border-top: 1px solid rgba(0, 255, 140, 0.15);
            padding-top: 15px;
        }

        .btn-tecla {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 140, 0.2);
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #e8fff2;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
        }

        .btn-tecla:hover {
            background: rgba(0, 255, 140, 0.12);
            border-color: rgba(0, 255, 140, 0.5);
        }

        .btn-tecla:active {
            transform: scale(0.95);
            background: rgba(0, 255, 140, 0.2);
        }

        .btn-limpar-teclado {
            background: rgba(255, 60, 60, 0.15);
            border-color: rgba(255, 60, 60, 0.3);
            color: #ff9999;
        }
        .btn-limpar-teclado:hover {
            background: rgba(255, 60, 60, 0.25);
            border-color: rgba(255, 60, 60, 0.5);
        }
    </style>
</head>
<body>

<!-- UNICO CONTAINER NO TOPO COM TUDO DENTRO -->
<div class="card card-topo">
    <h2>Calculadora de Taxas</h2>
    
    <div class="form-row">
        <div class="input-group">
            <label for="valorBase">Valor (R$):</label>
            <input type="text" id="valorBase" placeholder="0,00" readonly oninput="calcular()">
        </div>

        <div class="input-group">
            <label for="seletorTaxa">Modalidade:</label>
            <select id="seletorTaxa" onchange="calcular()">
                <!-- Populado via JS -->
            </select>
        </div>
    </div>

    <div class="info-box">
        <div class="resultado-atual">
            <span>Com taxa (<span id="nomeModalidadeAtual">-</span>):</span>
            <span class="valor-destaque" id="valorCalculadoAtual">R$ 0,00</span>
        </div>

        <button class="btn-adicionar" onclick="adicionarSomatorio()">Adicionar à Soma</button>

        <div class="soma-box" id="somaBox" onclick="limparSoma()" title="Clique para limpar a soma">
            <span>Soma total: <span class="soma-valor" id="somaValor">R$ 0,00</span></span>
            <span class="soma-limpar">limpar</span>
        </div>
    </div>

    <!-- Teclado Numérico integrado no mesmo box -->
    <div class="teclado-box">
        <button class="btn-tecla" onclick="digitarTecla('1')">1</button>
        <button class="btn-tecla" onclick="digitarTecla('2')">2</button>
        <button class="btn-tecla" onclick="digitarTecla('3')">3</button>
        <button class="btn-tecla" onclick="digitarTecla('4')">4</button>
        <button class="btn-tecla" onclick="digitarTecla('5')">5</button>
        <button class="btn-tecla" onclick="digitarTecla('6')">6</button>
        <button class="btn-tecla" onclick="digitarTecla('7')">7</button>
        <button class="btn-tecla" onclick="digitarTecla('8')">8</button>
        <button class="btn-tecla" onclick="digitarTecla('9')">9</button>
        <button class="btn-tecla btn-limpar-teclado" onclick="apagarUltimo()">⌫</button>
        <button class="btn-tecla" onclick="digitarTecla('0')">0</button>
        <button class="btn-tecla btn-limpar-teclado" onclick="limparInput()">C</button>
    </div>
</div>

<script>
    const taxas = [
        { nome: "Débito", taxa: 0.9801 },
        { nome: "Crédito", taxa: 0.9601 },
        { nome: "2x", taxa: 0.9401 },
        { nome: "3x", taxa: 0.9321 },
        { nome: "4x", taxa: 0.9251 },
        { nome: "5x", taxa: 0.9191 },
        { nome: "6x", taxa: 0.9101 },
        { nome: "7x", taxa: 0.9001 },
        { nome: "8x", taxa: 0.8921 },
        { nome: "9x", taxa: 0.8851 },
        { nome: "10x", taxa: 0.8801 },
        { nome: "11x", taxa: 0.8651 },
        { nome: "12x", taxa: 0.8601 }
    ];

    let somaAcumulada = 0;
    let ultimoResultadoCalculado = 0;
    let valorDigitadoEmCentavos = 0;

    // Preenche o select dinamicamente
    const selectEl = document.getElementById('seletorTaxa');
    taxas.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = item.nome;
        selectEl.appendChild(option);
    });

    let audioCtx = null;
    let audioSuportado = !!(window.AudioContext || window.webkitAudioContext);

    function tocarTom(freqInicial, freqFinal, duracao, tipoOnda, volume) {
        if (!audioSuportado) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = tipoOnda || 'sine';
            osc.frequency.setValueAtTime(freqInicial, audioCtx.currentTime);
            if (freqFinal && freqFinal !== freqInicial) {
                osc.frequency.exponentialRampToValueAtTime(freqFinal, audioCtx.currentTime + duracao);
            }

            gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duracao);
        } catch (e) {
            audioSuportado = false;
        }
    }

    function somSelecionar() {
        tocarTom(700, 1100, 0.12, 'sine', 0.15);
    }

    function somTeclar() {
        tocarTom(600, 800, 0.08, 'sine', 0.1);
    }

    function somLimpar() {
        tocarTom(500, 200, 0.25, 'triangle', 0.15);
    }

    function atualizarSoma() {
        document.getElementById('somaValor').textContent =
            "R$ " + somaAcumulada.toFixed(2).replace('.', ',');
    }

    function limparSoma() {
        somaAcumulada = 0;
        atualizarSoma();
        somLimpar();
    }

    function digitarTecla(num) {
        somTeclar();
        valorDigitadoEmCentavos = (valorDigitadoEmCentavos * 10) + parseInt(num);
        atualizarInputVisor();
        calcular();
    }

    function apagarUltimo() {
        somTeclar();
        valorDigitadoEmCentavos = Math.floor(valorDigitadoEmCentavos / 10);
        atualizarInputVisor();
        calcular();
    }

    function limparInput() {
        somLimpar();
        valorDigitadoEmCentavos = 0;
        atualizarInputVisor();
        calcular();
    }

    function atualizarInputVisor() {
        const valorReal = valorDigitadoEmCentavos / 100;
        document.getElementById('valorBase').value = valorReal > 0 ? valorReal.toFixed(2).replace('.', ',') : "";
    }

    function calcular() {
        const indiceTaxa = document.getElementById('seletorTaxa').value;
        const valorEfetivo = valorDigitadoEmCentavos / 100;

        const itemSelecionado = taxas[indiceTaxa];
        ultimoResultadoCalculado = valorEfetivo * itemSelecionado.taxa;

        document.getElementById('nomeModalidadeAtual').textContent = itemSelecionado.nome;
        document.getElementById('valorCalculadoAtual').textContent = 
            "R$ " + ultimoResultadoCalculado.toFixed(2).replace('.', ',');
    }

    function adicionarSomatorio() {
        if (ultimoResultadoCalculado <= 0) return;

        somaAcumulada += ultimoResultadoCalculado;
        atualizarSoma();

        valorDigitadoEmCentavos = 0;
        atualizarInputVisor();
        calcular();

        somSelecionar();
    }

    // Inicializa ao carregar
    calcular();
</script>

</body>
</html>
